# Base embeddings transformer model to fine-tune
base_model: liaad/srl-en_xlmr-base

# Paths to data to train and test model
data:
    train: ./models/srl/data/de_gsd-ud-up-train.conllup
    validation: ./models/srl/data/de_gsd-ud-up-dev.conllup
    test: ./models/srl/data/de_gsd-ud-up-test.conllup

# Training parameters
train:
    num_train_epochs: 3
    eval_strategy: epoch
    save_strategy: epoch
    logging_steps: 50
    save_total_limit: 2
    # Early stopping
    load_best_model_at_end: True
    metric_for_best_model: eval_f1
    greater_is_better: True

# Directory to save model configs, checkpoints, and final model
model_outdir: ./models/srl/pretrained/liaad/srl-en_xlmr-base
