[project]
name = "srl"
version = "0.1.0"
description = "Predicate-conditioned semantic role labeling (SRL) of German text with a fine-tuned transformer, trained on combined Universal Dependencies and Universal Propositions data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=5.0",
]

[dependency-groups]
dev = ["pytest>=8"]
# Command-line interface: spaCy and its German model for preprocessing text
cli = [
    "spacy>=3.8,<3.9",
    "de-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl",
]
# Fine-tuning new models
train = [
    "accelerate>=1.1",
    "datasets>=4.0",
    "seqeval>=1.2",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "sentencepiece>=0.2",
    "protobuf>=4.21",
]

[tool.uv]
default-groups = ["dev", "cli", "train"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs a trained SRL model (set SRL_MODEL_DIR)"]
